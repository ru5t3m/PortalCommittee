services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: knb
      POSTGRES_USER: knb
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      PORTAL_APP_PASSWORD: ${PORTAL_APP_PASSWORD:?Set PORTAL_APP_PASSWORD in .env}
      PORTAL_MIGRATION_PASSWORD: ${PORTAL_MIGRATION_PASSWORD:?Set PORTAL_MIGRATION_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/10-app-roles.sql:/docker-entrypoint-initdb.d/10-app-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knb"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: portalcommittee-api
    build: ./apps/api
    command: ["python", "-m", "app.db.migrate"]
    environment:
      DATABASE_URL: postgresql+psycopg://portal_migrator:${PORTAL_MIGRATION_PASSWORD:?Set PORTAL_MIGRATION_PASSWORD in .env}@postgres:5432/knb
      MIGRATION_RUNTIME_ROLE: portal_app
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: portalcommittee-api
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://portal_app:${PORTAL_APP_PASSWORD:?Set PORTAL_APP_PASSWORD in .env}@postgres:5432/knb
      JWT_SECRET: change-this-secret
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
      ALLOWED_HOSTS: '["localhost","127.0.0.1","api"]'
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
